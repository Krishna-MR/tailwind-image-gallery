<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Image Gallery</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="min-h-screen p-4">

  <nav class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">Hello!</h1>

    <div>
      <a href="#" class="mr-4">Log in</a>
      <button class="border border-black rounded-lg p-2">
        Sign up
      </button>
    </div>

  <div class="grid grid-cols-2 gap-2
              lg:grid-cols-6 lg:grid-rows-4
              lg:h-[calc(100vh-110px)]">


    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-1 lg:row-start-1"
      src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
      alt="Beach"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-span-3 lg:row-span-2 lg:col-start-2 lg:row-start-1"
      src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1200"
      alt="Anime artwork"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-5 lg:row-start-1"
      src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800"
      alt="Sunset"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-6 lg:row-start-1"
      src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=800"
      alt="Dark forest"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-1 lg:row-start-2"
      src="https://images.unsplash.com/photo-1519046904884-53103b34b206?w=800"
      alt="Coastal landscape"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-5 lg:row-start-2"
      src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800"
      alt="Fantasy mountains"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-6 lg:row-start-2"
      src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=800"
      alt="Night sky"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-1 lg:row-start-3"
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800"
      alt="Golden sunset"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-2 lg:row-start-3"
      src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800"
      alt="Forest"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-3 lg:row-start-3"
      src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800"
      alt="Fantasy landscape"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-span-3 lg:row-span-2 lg:col-start-4 lg:row-start-3"
      src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200"
      alt="Mountain landscape"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-1 lg:row-start-4"
      src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=800"
      alt="Nature"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-2 lg:row-start-4"
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
      alt="Landscape"
    >

    <img
      class="w-full h-40 lg:h-full min-h-0 object-cover rounded-lg lg:col-start-3 lg:row-start-4"
      src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"
      alt="Beach"
    >

  </div>

</body>
</html>
